services:
  db:
    image: postgres:15
    container_name: n27_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: lms-n27
    ports:
      - "5433:5432"
    volumes:
      - baza_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: n27_redis 
    restart: always 
    ports:
      - "6379:6379"
  app:
    build: .
    container_name: lms_n27_app
    restart: always
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    ports:
      - "8080:4000"
    depends_on:
      - db
      - redis
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma db push &&
        npm run start:prod
      "
    environment:
      DATABASE_URL: postgres://postgres:12345@db:5432/lms-n27
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  baza_data: